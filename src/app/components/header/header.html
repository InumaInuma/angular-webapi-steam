<header class="gg-header">
    <div class="header-container">
        <!-- Izquierda: Logo -->
        <a routerLink="/pagina-principal" class="brand-logo">
            <img src="/logogg.jpeg" alt="GGCausa Logo" />
        </a>

        <!-- Centro: Navegación -->
        <nav class="main-nav">
            <a routerLink="/pagina-principal" routerLinkActive="active"
                [routerLinkActiveOptions]="{exact: true}">Home</a>
            <a routerLink="/marketplace" routerLinkActive="active">Trade</a>
            <a routerLink="/sales-hub" routerLinkActive="active">Ventas</a>
            <a routerLink="/dota-items" routerLinkActive="active">Inventory</a>
            <a routerLink="/support" routerLinkActive="active">Help</a>
        </nav>

        <!-- Derecha: Búsqueda y Botones/Usuario -->
        <div class="header-right">


            <!-- Autenticación -->
            <ng-container *ngIf="!authService.isLoggedIn(); else loggedMenu">
                <div class="auth-buttons">
                    <button class="btn-login" routerLink="/login">Log in</button>
                    <button class="btn-signup" routerLink="/login" [queryParams]="{ register: true }">Sign Up</button>
                </div>
            </ng-container>

            <!-- Usuario Logeado -->
            <ng-template #loggedMenu>
                <div class="user-menu">
                    <!-- Balance -->
                    <div *ngIf="roles.includes('Customer')" class="wallet-badge" routerLink="/topup"
                        title="Recargar saldo">
                        <span class="balance">S/ {{ authService.balance() | number:'1.2-2' }}</span>
                        <div class="plus-btn">+</div>
                    </div>

                    <!-- Perfil -->
                    <a routerLink="/profile" class="profile-btn" title="Mi Perfil">
                        <i class="fas fa-user"></i>
                        <span class="status-dot" [ngClass]="{
                            'verified': authService.isTradeVerified(),
                            'escrow': !authService.isTradeVerified() && !authService.isTradeBanned(),
                            'banned': authService.isTradeBanned()
                        }"></span>
                    </a>

                    <!-- Admin Dashboard -->
                    <a *ngIf="roles.includes('Admin')" routerLink="/dashboard" class="admin-btn" title="Dashboard">
                        <i class="fas fa-chart-line"></i>
                    </a>

                    <!-- Logout -->
                    <button class="btn-logout" (click)="logout()" title="Cerrar sesión">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </ng-template>
        </div>
    </div>
</header>
